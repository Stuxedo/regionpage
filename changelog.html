<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://global.media.stuxedo.com/icon.png">
    <meta name="description" content="Everything that's changed on this Stuxedo region page, release by release.">
    <title>Changelog — Stuxedo</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #031e0d; --bg-card: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.07);
            --text-1: #eef2ee; --text-2: rgba(238, 242, 238, 0.55); --text-3: rgba(238, 242, 238, 0.35);
            --accent: #4bf708; --accent-bg: rgba(75, 247, 8, 0.12); --accent-bg-hover: rgba(75, 247, 8, 0.18);
            --accent-border: rgba(75, 247, 8, 0.3); --accent-border-strong: rgba(75, 247, 8, 0.35); --accent-border-hover: rgba(75, 247, 8, 0.55);
            --accent-hover: rgba(75, 247, 8, 0.22);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #e6fff0; --bg-card: rgba(0, 0, 0, 0.04); --border: rgba(0, 0, 0, 0.08);
                --text-1: #08100b; --text-2: rgba(0, 0, 0, 0.55); --text-3: rgba(8, 16, 11, 0.35);
                --accent: #032f14; --accent-bg: rgba(3, 47, 20, 0.07); --accent-bg-hover: rgba(3, 47, 20, 0.11);
                --accent-border: rgba(3, 47, 20, 0.22); --accent-border-strong: rgba(3, 47, 20, 0.28); --accent-border-hover: rgba(3, 47, 20, 0.45);
                --accent-hover: rgba(3, 47, 20, 0.13);
            }
        }
        :root.theme-light {
            --bg: #e6fff0; --bg-card: rgba(0, 0, 0, 0.04); --border: rgba(0, 0, 0, 0.08);
            --text-1: #08100b; --text-2: rgba(0, 0, 0, 0.55); --text-3: rgba(8, 16, 11, 0.35);
            --accent: #032f14; --accent-bg: rgba(3, 47, 20, 0.07); --accent-bg-hover: rgba(3, 47, 20, 0.11);
            --accent-border: rgba(3, 47, 20, 0.22); --accent-border-strong: rgba(3, 47, 20, 0.28); --accent-border-hover: rgba(3, 47, 20, 0.45);
            --accent-hover: rgba(3, 47, 20, 0.13);
        }
        :root.theme-dark {
            --bg: #031e0d; --bg-card: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.07);
            --text-1: #eef2ee; --text-2: rgba(238, 242, 238, 0.55); --text-3: rgba(238, 242, 238, 0.35);
            --accent: #4bf708; --accent-bg: rgba(75, 247, 8, 0.12); --accent-bg-hover: rgba(75, 247, 8, 0.18);
            --accent-border: rgba(75, 247, 8, 0.3); --accent-border-strong: rgba(75, 247, 8, 0.35); --accent-border-hover: rgba(75, 247, 8, 0.55);
            --accent-hover: rgba(75, 247, 8, 0.22);
        }

        html, body { background: var(--bg); color: var(--text-1); font-family: 'Inter', sans-serif; min-height: 100%; transition: background 0.3s, color 0.3s; }

        a, a:visited { color: var(--accent) !important; text-decoration: none !important; }
        a:hover, a:focus { opacity: 0.8; }

        .site-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 6%; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--text-1) !important; }
        .brand img { height: 32px; width: auto; }

        #theme-toggle {
            background: var(--accent-bg); border: 1px solid var(--accent-border-strong); border-radius: 50%;
            width: 38px; height: 38px; font-size: 17px; line-height: 38px; text-align: center; cursor: pointer;
            padding: 0; color: var(--accent); transition: background 0.2s, border-color 0.2s;
        }
        #theme-toggle:hover { background: var(--accent-hover); border-color: var(--accent-border-hover); }

        main { max-width: 780px; margin: 0 auto; padding: 10px 6% 60px; }

        h1 { font-family: 'Stuxedo Tale', 'Exo 2', sans-serif; font-weight: 800; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.02em; margin: 10px 0 6px; }
        .subtitle { color: var(--text-2); font-size: 1.05rem; margin: 0 0 32px; line-height: 1.6; font-weight: 300; }

        .changelog-entry {
            padding: 20px 22px; margin: 0 0 16px; border: 1px solid var(--border); border-radius: 12px;
            background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .changelog-entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
        .changelog-version { margin: 0; font-size: 1.15rem; color: var(--text-1); font-weight: 700; }

        .changelog-label-row { margin: 14px 0 8px; }
        .changelog-label-row:first-of-type { margin-top: 0; }
        .changelog-label {
            display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
            padding: 3px 9px; border-radius: 5px; color: var(--cl); background: color-mix(in srgb, var(--cl) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--cl) 45%, transparent);
        }
        /* Fixed type palette & order: Added, Changed, Fixed, Removed, Security, Deprecated */
        .changelog-label-added      { --cl: #2ecc71; }
        .changelog-label-changed    { --cl: #3ba7ff; }
        .changelog-label-fixed      { --cl: #ffa64d; }
        .changelog-label-removed    { --cl: #ff4d4d; }
        .changelog-label-security   { --cl: #b06bff; }
        .changelog-label-deprecated { --cl: #8a8a94; }
        @media (prefers-color-scheme: light) {
            :root:not(.theme-dark) .changelog-label-added      { --cl: #1e8449; }
            :root:not(.theme-dark) .changelog-label-changed    { --cl: #1a6fc0; }
            :root:not(.theme-dark) .changelog-label-fixed      { --cl: #b8650f; }
            :root:not(.theme-dark) .changelog-label-removed    { --cl: #c62828; }
            :root:not(.theme-dark) .changelog-label-security   { --cl: #7b3fc4; }
            :root:not(.theme-dark) .changelog-label-deprecated { --cl: #5f5f68; }
        }
        :root.theme-light .changelog-label-added      { --cl: #1e8449; }
        :root.theme-light .changelog-label-changed    { --cl: #1a6fc0; }
        :root.theme-light .changelog-label-fixed      { --cl: #b8650f; }
        :root.theme-light .changelog-label-removed    { --cl: #c62828; }
        :root.theme-light .changelog-label-security   { --cl: #7b3fc4; }
        :root.theme-light .changelog-label-deprecated { --cl: #5f5f68; }

        .changelog-list { margin: 0 0 4px; padding-left: 20px; color: var(--text-2); font-size: 0.92rem; line-height: 1.65; font-weight: 300; }
        .changelog-list li { margin: 0 0 4px; }
        .changelog-list code { background: var(--accent-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
        .changelog-p { color: var(--text-2); font-size: 0.92rem; font-weight: 300; }

        footer { text-align: center; padding: 20px 6% 40px; font-size: 0.8rem; color: var(--text-3); border-top: 1px solid var(--border); margin-top: 20px; }
        footer a, footer a:visited { color: var(--text-3) !important; font-weight: 400; opacity: 0.8; }
        footer a:hover { opacity: 1; }
    </style>

<main>
    <h1>Changelog</h1>
    <p class="subtitle">
        Everything that's changed on this Stuxedo region page, release by release.
    </p>

    <div id="changelog-body">
        <p class="changelog-p">Loading changelog&hellip;</p>

<script>
    (function () {
        var root = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var stored = localStorage.getItem('stuxedo-theme');
        var isDark = stored ? stored === 'dark' : prefersDark;

        function apply(dark) {
            root.classList.toggle('theme-dark', dark);
            root.classList.toggle('theme-light', !dark);
            btn.textContent = dark ? '☀' : '☾';
            btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
        }

        apply(isDark);

        btn.addEventListener('click', function () {
            isDark = !isDark;
            localStorage.setItem('stuxedo-theme', isDark ? 'dark' : 'light');
            apply(isDark);
        });
    })();
</script>
<script>
    (function () {
        var target = document.getElementById('changelog-body');
        var CATEGORIES = ['Added', 'Changed', 'Fixed', 'Removed', 'Security', 'Deprecated'];

        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function inline(s) {
            s = esc(s);
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            return s;
        }
        // Sort ### sections within each release into CATEGORIES order (unknown types last).
        function sectionRank(heading) {
            var w = ((heading.match(/^###\s+([A-Za-z]+)/) || [])[1] || '').toLowerCase();
            for (var i = 0; i < CATEGORIES.length; i++) {
                if (CATEGORIES[i].toLowerCase() === w) return i;
            }
            return CATEGORIES.length;
        }
        function sortSections(md) {
            var out = [], pre = [], secs = [];
            function flush() {
                secs.sort(function (a, b) { return (a.rank - b.rank) || (a.idx - b.idx); });
                out = out.concat(pre);
                secs.forEach(function (s) { out = out.concat(s.lines); });
                pre = []; secs = [];
            }
            md.split('\n').forEach(function (line) {
                if (/^#{1,2}\s/.test(line)) { flush(); pre.push(line); return; }
                if (/^###\s/.test(line)) { secs.push({ rank: sectionRank(line), idx: secs.length, lines: [line] }); return; }
                if (secs.length) secs[secs.length - 1].lines.push(line); else pre.push(line);
            });
            flush();
            return out.join('\n');
        }
        function renderChangelog(md) {
            var lines = sortSections(md.replace(/\r\n/g, '\n').trim()).split('\n');
            var html = '';
            var inEntry = false;
            var inList = false;
            var itemBuf = null;
            var catPattern = new RegExp('^(' + CATEGORIES.join('|') + ')\\b\\s*(.*)$');

            function flushItem() { if (itemBuf !== null) { html += '<li>' + inline(itemBuf) + '</li>\n'; itemBuf = null; } }
            function flushList() { flushItem(); if (inList) { html += '</ul>\n'; inList = false; } }
            function flushEntry() { flushList(); if (inEntry) { html += '</div>\n'; inEntry = false; } }

            lines.forEach(function (raw) {
                var line = raw.replace(/\s+$/, '');
                if (line.trim() === '') { flushItem(); return; }

                var m = line.match(/^##\s+(.+)$/);
                if (m) {
                    flushEntry();
                    html += '<div class="changelog-entry"><div class="changelog-entry-head"><h3 class="changelog-version">' + esc(m[1].trim()) + '</h3></div>\n';
                    inEntry = true;
                    return;
                }

                m = line.match(/^###\s+(.+)$/);
                if (m) {
                    flushList();
                    var text = m[1].trim();
                    var cm = text.match(catPattern);
                    if (cm) {
                        html += '<div class="changelog-label-row"><span class="changelog-label changelog-label-' + cm[1].toLowerCase() + '">' + cm[1] + '</span></div>\n';
                    } else {
                        html += '<h4 class="changelog-section">' + esc(text) + '</h4>\n';
                    }
                    return;
                }

                m = line.match(/^-\s+(.+)$/);
                if (m) {
                    flushItem();
                    if (!inList) { html += '<ul class="changelog-list">\n'; inList = true; }
                    itemBuf = m[1].trim();
                    return;
                }

                if (/^#\s+/.test(line)) { flushItem(); return; }

                if (inList && itemBuf !== null) {
                    itemBuf += ' ' + line.trim();
                }
            });

            flushEntry();
            target.innerHTML = html || '<p class="changelog-p">No changelog entries yet.</p>';
        }

        fetch('CHANGELOG.md')
            .then(function (r) {
                if (!r.ok) throw new Error('fetch failed');
                return r.text();
            })
            .then(renderChangelog)
            .catch(function () {
                target.innerHTML = '<p class="changelog-p">Couldn’t load the changelog right now &mdash; see <a href="https://github.com/Stuxedo/regionpage/blob/main/CHANGELOG.md">CHANGELOG.md</a> on GitHub instead.</p>';
            });
    })();
</script>
